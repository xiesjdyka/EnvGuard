name: macOS native build and test
on:
  push:
    branches: [main, 'feat/macos-*']
    paths: ['src/macos/**', '.github/workflows/macos.yml', 'LICENSE']
  pull_request:
    paths: ['src/macos/**', '.github/workflows/macos.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build universal native app
        run: bash src/macos/build.sh "$PWD/out/macos"
      - name: Isolated headless tests
        run: bash src/macos/test.sh "$PWD/out/macos"
      - name: Package verified app and source
        run: bash src/macos/package.sh "$PWD/out/macos"
      - name: Keep macOS portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EnvGuard-macos-${{ matrix.runner }}
          path: |
            out/EnvGuard_macOS_Release.zip
            out/SHA256SUMS-macos.txt
          if-no-files-found: error
